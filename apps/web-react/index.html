<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="Kampüs — okul, veli ve öğrenci platformu." />
    <title>Kampüs</title>
    <script>
      // Tema ilk boyamadan önce uygulanır; tercih Vue uygulamasıyla aynı anahtarda tutulur.
      try {
        if (localStorage.getItem('kampus-theme') === 'dark')
          document.documentElement.dataset.theme = 'dark'
      } catch (error) {
        console.warn('[theme] tercih okunamadı', error)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
