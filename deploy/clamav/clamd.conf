# clamd yapılandırması (ADR 0003 karar 8; OG-092). `compose.yaml` `clamav` profili bu dosyayı resmî
# `clamav/clamav` imajında /etc/clamav/clamd.conf yerine bağlar. Üretim kurulumu da aynı ayarları
# kullanır. Belirtilmeyen seçenekler clamd varsayılanıdır.

# İmajın beklediği yollar: giriş betiği soketi ve PID dosyasını /tmp altında arar.
LocalSocket /tmp/clamd.sock
PidFile /tmp/clamd.pid
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav
# LogFile verilmez: ön planda çalışan clamd konteynerin çıktısına yazar. INSTREAM'de dosya adı
# yoktur (yalnız "stream"), adı clamd loguna girmez.
LogTime yes

# Sınırlar (Sabah kararı 43). En büyük yükleme core `FILE_PURPOSES` içindeki en büyük amaç sınırıdır:
# materyalde video (video/mp4) 200 MB. Akış ve dosya sınırları bunun üstündedir; böylece izinli her
# yükleme sonuna kadar taranır.
# - StreamMaxLength: INSTREAM ile alınan en çok bayt. Aşılırsa clamd "INSTREAM size limit exceeded"
#   döner; API bunu kalıcı ret sayar (`scan_limit_exceeded`), dosya taramasız `ready` olmaz.
StreamMaxLength 210M
# - MaxFileSize: taranan tek dosyanın (arşiv/belge içindekiler dahil) en büyük boyu.
MaxFileSize 210M
# - MaxScanSize: tek taramada açılan toplam veri (docx/zip içeriği açılınca büyür): 2 x akış sınırı.
MaxScanSize 420M
# - Arşiv derinliği, dosya sayısı ve gömülü içerik sınırları clamd varsayılanlarının açık yazımıdır;
#   meşru Office/PDF bunlara ulaşmaz, ulaşan içerik (arşiv bombası) reddedilir.
MaxRecursion 17
MaxFiles 10000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxScriptNormalize 20M
MaxZipTypeRcg 1M
# - MaxScanTime (ms): tek taramanın clamd'deki üst süresi; API'nin üst süresinden (CLAMAV_TIMEOUT_MS,
#   120 sn) kısa ki clamd sonucu API vazgeçmeden gelsin. Aşılırsa sınır bulgusudur (aşağıda).
MaxScanTime 100000
# AlertExceedsMax: yukarıdaki sınırlardan birini aşan içerik "Heuristics.Limits.Exceeded.*" FOUND
# olarak bildirilir; API zararlı gibi reddeder. Kapalı olsaydı clamd sınırı aşan kısmı taramadan
# "OK" derdi ve dosya taramasız `ready` olurdu.
AlertExceedsMax yes
# Bağlantı ve okuma süreleri API'nin üst süresiyle (CLAMAV_TIMEOUT_MS, 120 sn) uyumlu.
ReadTimeout 120
CommandReadTimeout 30

# ADR 0003 karar 8: makrolu Office (OLE2), parola korumalı/şifreli belge ve PDF sezgileri zararlı
# sayılır (`Heuristics.*` imzaları); API bulguyu reddeder.
HeuristicAlerts yes
ScanPDF yes
ScanOLE2 yes
AlertOLE2Macros yes
# Şifreli arşiv ve belgeyi birlikte açar (AlertEncryptedArchive, AlertEncryptedDoc).
AlertEncrypted yes
