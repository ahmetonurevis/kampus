# Kampüs demo — managed by scripts/deploy.sh
server {
    listen 80;
    listen [::]:80;
    server_name demo.onurevis.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://demo.onurevis.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.onurevis.com;

    ssl_certificate /etc/letsencrypt/live/demo.onurevis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.onurevis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS yalnız HTTPS sunucusunda. preload yok: preload listesi alan adının kaydedilebilir kökünü
    # (onurevis.com) ister; başlığın kökte includeSubDomains ile sunulması gerekir ve listeye giriş
    # tüm alt alan adlarını (sunucu.onurevis.com dahil) tarayıcılarda aylarca geri alınamaz biçimde
    # HTTPS'e bağlar. Demo alt alanı tek başına listeye alınamaz; kök alan adı için ayrı karar gerekir.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Diğer güvenlik başlıkları (CSP, Permissions-Policy …) bu include'dadır.
    include /etc/nginx/snippets/kampus-demo.conf;
}
