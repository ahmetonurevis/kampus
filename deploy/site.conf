# Kampüs demo: yalnızca demo.onurevis.com sanal sunucusuna dahil edilir.
root /var/www/kampus-demo/current;
index index.html;
server_tokens off;
expires -1;

access_log /var/log/nginx/kampus-demo.access.log;
error_log /var/log/nginx/kampus-demo.error.log warn;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location = /healthz {
    alias /var/www/kampus-demo/current/health.json;
    default_type application/json;
}

# PDF.js module worker, Nginx 1.18'in varsayılan MIME listesinde bulunmaz.
location ~ ^/assets/.*\.mjs$ {
    root /var/www/kampus-demo;
    types { application/javascript mjs; }
    try_files $uri =404;
    expires 1y;
}

# Eski sekmelerin lazy-loaded dosyaları güncellemeden sonra da erişilebilir kalır.
location /assets/ {
    root /var/www/kampus-demo;
    try_files $uri =404;
    expires 1y;
}

location /videos/ {
    try_files $uri =404;
    expires 1h;
}

location /fonts/ {
    try_files $uri =404;
    expires 1d;
}

location / {
    try_files $uri $uri/ /index.html;
}

location ~ /\. {
    deny all;
}
