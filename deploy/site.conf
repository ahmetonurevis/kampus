# Kampüs demo: yalnızca demo.onurevis.com sanal sunucusuna dahil edilir.
root /var/www/kampus-demo/current;
index index.html;
server_tokens off;
expires -1;

access_log /var/log/nginx/kampus-demo.access.log;
error_log /var/log/nginx/kampus-demo.error.log warn;

# Güvenlik başlıkları (OG-203; docs/muhendislik/guvenlik-kvkk.md §5).
#
# add_header miras tuzağı: bir location içinde tek bir add_header bile yazılırsa üst düzeydeki
# (server) başlıkların hepsi o location için düşer. Bu dosyadaki location'larda add_header yoktur
# (expires Cache-Control/Expires üretir, add_header sayılmaz). Bir location'a add_header
# eklenecekse aşağıdaki beş başlığın hepsi o location'da yinelenmelidir. HSTS bu dosyada değil,
# yalnız https.conf'taki 443 sunucusunda tanımlıdır (düz HTTP'de gönderilmez).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "accelerometer=(), bluetooth=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(self), midi=(), payment=(), serial=(), usb=()" always;

# Content-Security-Policy, derlenmiş web'in (Vue demosu ve React) gerçekte yüklediği kaynaklara göre.
# Başlıkta satır sonu bulunamayacağından tek satırdır. Gerekçeler:
# - default-src 'self': Google Fonts/CDN yok; Inter (@fontsource) ve Noto Sans /assets ve /fonts'tan gelir.
# - script-src 'self' + sha256: derlemede satır içi betik yalnız React index.html'indeki tema betiğidir
#   (ilk boyamadan önce koyu temayı uygular). Hash o betiğin birebir metnine aittir; apps/web-react/
#   index.html'deki betik değişirse hash yeniden hesaplanmalıdır:
#   node -e "console.log(require('crypto').createHash('sha256').update(<betik metni>).digest('base64'))"
#   (Vue demosunda satır içi betik yoktur; hash orada kullanılmaz.) unsafe-eval ve unsafe-inline yok.
# - style-src 'unsafe-inline' React web için ZORUNLU: sonner (toast) ve react-remove-scroll-bar (Radix
#   pencerelerinin kaydırma kilidi) çalışma anında <style> öğesi yazar; PDF yazdırma penceresi de
#   (about:blank, açan sayfanın politikasını devralır) <style> ekler. Nonce statik sunucuda üretilemez.
#   Vue demosu bu izin olmadan da çalışır; ortak politika React'e göredir. Betik tarafında gevşeme
#   yoktur: stil enjeksiyonu betik çalıştıramaz.
# - img-src data: yazdırma penceresi PNG'leri (toDataURL) ve CSS/SVG data: görselleri içindir; blob:
#   görsel kullanılmaz.
# - media-src blob: konuşma/dinleme kayıtlarının geçici adresleri (MediaRecorder, VTT) içindir; video
#   /videos'tan gelir.
# - worker-src 'self': pdf.js module worker'ı aynı kökenden (/assets/*.mjs) yüklenir; blob: gerekmedi.
# - connect-src blob: yok: uygulama blob adreslerini fetch etmez (PDF bellekten okunur). Yalnız
#   tests/e2e/ux-flows.spec.js'teki "URL temizliği" adımı test içinden fetch(blob:) yapar; bu test
#   CSP'li sunucuya karşı koşulacaksa o adım ayrıca ele alınmalıdır (CI testleri CSP'siz önizleme
#   sunucusundadır).
# - frame-src tanımsız: sitenin iframe'i yok, default-src 'self' yeter. connect-src 'self': React web
#   API'yi aynı kökenden (/api) çağırır; API ayrı kökene taşınırsa o köken buraya eklenir.
# - upgrade-insecure-requests yok: http.conf (sertifika alınana kadarki geçici HTTP) bozulmasın; HTTPS'i
#   HSTS ve 301 yönlendirmesi sağlar.
# Report-Only yerine doğrudan uygulanır: statik sunucuda ihlal raporu toplayan uç yok, yani Report-Only
# yalnız tarayıcı konsoluna yazar ve gözlemlenemez. Politika bu nginx yapılandırmasıyla gerçek
# tarayıcıda denendi: Vue demosunun belge/PDF/yazdırma e2e senaryoları ve React web girişi
# (tema betiği çalıştı, ihlal yok). Beklenmedik bir engel çıkarsa başlık adını geçici olarak
# Content-Security-Policy-Report-Only yapıp yeniden yayınlamak geri dönüş yoludur.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-wWUpLgZyeUzH/TtVX5vFekBs7Zf6PSVexNfeGCRBK5s='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

location = /healthz {
    alias /var/www/kampus-demo/current/health.json;
    default_type application/json;
}

# PDF.js module worker, Nginx 1.18'in varsayılan MIME listesinde bulunmaz.
location ~ ^/assets/.*\.mjs$ {
    root /var/www/kampus-demo;
    types { application/javascript mjs; }
    try_files $uri =404;
    expires 1y;
}

# Eski sekmelerin lazy-loaded dosyaları güncellemeden sonra da erişilebilir kalır.
location /assets/ {
    root /var/www/kampus-demo;
    try_files $uri =404;
    expires 1y;
}

location /videos/ {
    try_files $uri =404;
    expires 1h;
}

location /fonts/ {
    try_files $uri =404;
    expires 1d;
}

location / {
    try_files $uri $uri/ /index.html;
}

location ~ /\. {
    deny all;
}
