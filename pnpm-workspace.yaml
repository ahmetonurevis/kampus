packages:
  - apps/*
  - packages/*
allowBuilds:
  core-js: false
  esbuild: true
minimumReleaseAgeExclude:
  - '@eslint-react/ast@5.21.0'
  - '@eslint-react/core@5.21.0'
  - '@eslint-react/eslint@5.21.0'
  - '@eslint-react/jsx@5.21.0'
  - '@eslint-react/shared@5.21.0'
  - '@eslint-react/var@5.21.0'
  - eslint-plugin-react-x@5.21.0
onlyBuiltDependencies:
  - esbuild
# OG-201: geçişli güvenlik yamaları; yalnız açıklı aralıklar sabitlenir.
overrides:
  'dompurify@<3.4.17': 3.4.17
  'node-forge@<1.4.1': 1.4.1
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'zod@>=4.0.0 <4.6.6': 4.6.6
